" font-size="15" fill="#203b52" font-weight="600">Duplex MEP</text><rect x="325" y="180" width="0" height="27" rx="4" fill="#438aaf"/><text x="337" y="199" text-anchor="start" font-family="Arial,sans-serif" font-size="15" fill="#203b52" font-weight="600">0.0%</text><text x="52" y="247" text-anchor="start" font-family="Arial,sans-serif" font-size="15" fill="#203b52" font-weight="600">Clinic HVAC</text><rect x="325" y="227" width="574.3790496760259" height="27" rx="4" fill="#b58a55"/><text x="911.3790496760259" y="246" text-anchor="start" font-family="Arial,sans-serif" font-size="15" fill="#203b52" font-weight="600">99.9%</text><text x="52" y="317" text-anchor="start" font-family="Arial,sans-serif" font-size="12" fill="#6d7d8b" font-weight="400">Port coverage is descriptive and does not certify correct engineering connectivity.</text></svg>