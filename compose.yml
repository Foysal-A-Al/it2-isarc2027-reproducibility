name: it2-isarc-research
services:
  evidence:
    build: .
    image: it2-isarc-research:local
    container_name: it2-isarc-evidence
    ports:
      - "127.0.0.1:8674:8080"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    mem_limit: 256m
    pids_limit: 64
